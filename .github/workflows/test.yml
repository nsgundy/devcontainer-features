name: Test Features
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Release guard tests
        run: python3 -m unittest discover -s test -p test_release.py -v
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: No-socket distro and security tests
        run: python3 test/1password-desktop/run_matrix.py '${{ matrix.image }}'
